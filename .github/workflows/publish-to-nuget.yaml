# Workflow to execute when a publish is made on github https://github.com/smbecker/dotpulsar-extensions/releases/new
name: Publish

on:
  release:
    types:
    - published
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # MinVer needs the full history and tags to compute the version
    - name: setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: create nuget packages
      run: dotnet pack -c release --include-symbols -o artifacts
    - name: nuget login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: publish to nuget.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
